services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: chat-backend

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./.env

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - chat-network

  mysql:
    image: mysql:8.4
    container_name: chat-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: chat
      MYSQL_USER: chat
      MYSQL_PASSWORD: chat
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - chat-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: chat-phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8080:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - chat-network

  redis:
    image: redis/redis-stack:latest
    container_name: chat-redis
    restart: unless-stopped

    ports:
      - "6379:6379"
      - "8001:8001"

    volumes:
      - redis-data:/data

    networks:
      - chat-network


volumes:

  mysql-data:

  redis-data:


networks:

  chat-network:
    driver: bridge